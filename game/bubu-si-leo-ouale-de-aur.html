/* Two rows of pointed mountains with pale snow on top, for George's arena. */

/* ==========================================================================
   SOUND: everything is generated with the Web Audio API.
   Sine and triangle waves, low-pass filters, a soft generated reverb.
   ========================================================================== */
const Snd = (() => {
  let ac = null, master, musicBus, ambBus, chrBus, timer = null;
  const vol = { music: CONFIG.volume.music, amb: CONFIG.volume.ambient, chr: CONFIG.volume.characters };
  const outs = [null, null];          // where each hero's own sounds play: null = computer, or a bus on another speaker
  const sinks = {};                   // deviceId -> { ac, bus }: one extra audio output per controller speaker
  const noiseBufs = new WeakMap();
  let song = null, songKey = null, step = 0, nextT = 0, duck = 1;
  let amb = null, bedW = null, bedA = null, cricketT = 0;

  /* The last thing before any speaker: a limiter. A loud word, a stomp and the music at the same moment would otherwise

    lim.threshold.value = -8; lim.knee.value = 4; lim.ratio.value = 20; lim.attack.value = 0.002; lim.release.value = 0.12;
    trim.gain.value = 0.85;

  }
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); for (const id in sinks) if (sinks[id].ac.state === 'suspended') sinks[id].ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { ac = null; return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6500; lp.Q.value = 0.3;
    master = ac.createGain(); master.gain.value = 1.3;
    master.connect(lp); lp.connect(comp); toSpeaker(ac, comp);
    const rev = ac.createConvolver(); rev.buffer = impulse(2.6);
    const revOut = ac.createGain(); revOut.gain.value = 0.55; rev.connect(revOut); revOut.connect(master);
    musicBus = ac.createGain(); ambBus = ac.createGain(); chrBus = ac.createGain();
    musicBus.connect(master); ambBus.connect(master); chrBus.connect(master);
    const send = (bus, g) => { const s = ac.createGain(); s.gain.value = g; bus.connect(s); s.connect(rev); };
    send(musicBus, 0.5); send(ambBus, 0.3); send(chrBus, 0.26);

    const bed = (type, f, q) => { const s = ac.createBufferSource(); s.buffer = nbuf(ac); s.loop = true; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = ac.createGain(); g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(ambBus); s.start(); return g; };

    applyVol(); applyAmb();

    }

    ambBus.gain.setTargetAtTime(vol.amb, ac.currentTime, 0.05);
    chrBus.gain.setTargetAtTime(vol.chr, ac.currentTime, 0.05);
    for (const id in sinks) sinks[id].bus.gain.value = vol.chr * 1.6;
  }

    if (!ac) return;
    bedW.gain.setTargetAtTime(amb ? (amb.water || 0) * 0.05 : 0, ac.currentTime, 0.8);
    bedA.gain.setTargetAtTime(amb ? (amb.wind || 0) * 0.045 : 0, ac.currentTime, 0.8);

    const g = cc.createRadialGradient(-R * 0.2, -R * 0.3, 1, 0, 0, R); g.addColorStop(0, '#FFFDF0'); g.addColorStop(1, '#FFE7A0');
    cc.fillStyle = g; cc.fill();

  });
  c.save(); c.translate(x, y - r * 1.1 - (z || 0) + Math.sin(t * 2.4) * 5); c.rotate(Math.sin(t * 1.3) * 0.25);
  c.drawImage(sp, -75 * k, -75 * k, 150 * k, 150 * k); c.restore();
}
/* The helper that makes both heroes fast for a moment: a butterfly in the first game, a little rocket in the second. */
function drawButterfly(c, x, y, t, s) {
  if (isLupta()) { drawRocket(c, x, y, t, s); return; }
  c.save(); c.translate(x, y); c.scale(s || 1, s || 1);
  const gg = c.createRadialGradient(0, 0, 4, 0, 0, 70); gg.addColorStop(0, 'rgba(255,200,120,0.5)'); gg.addColorStop(1, 'rgba(255,200,120,0)');
  c.fillStyle = gg; c.beginPath(); c.arc(0, 0, 70, 0, TAU); c.fill();
  const fl = 0.25 + Math.abs(Math.sin(t * 11)) * 0.75;
  for (const sd of [-1, 1]) {
    c.save(); c.scale(sd * fl, 1);
    puff(c, 15, -9, 16, 14, '#F2913C', 95, 'rgba(180,90,50,0.4)'); puff(c, 12, 10, 11, 10, '#F6B25A', 96, 'rgba(180,90,50,0.4)');
    soft(c, 17, -9, 7, 6, '#FFE2A6', 0.8, 97); soft(c, 12, 10, 4, 4, '#FFF0CC', 0.8, 98);
    c.restore();
  }
  puff(c, 0, 0, 3.5, 13, '#7A4A3A', 99, 0);
  c.strokeStyle = '#7A4A3A'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(0, -11); c.quadraticCurveTo(-4, -20, -8, -22); c.moveTo(0, -11); c.quadraticCurveTo(4, -20, 8, -22); c.stroke();
  c.restore();
}
/* A woven nest seen from above. */
function drawNest(c, x, y, r, seed, glow) {
  const N = isLupta() ? ['#4E9A78', '#2F6A62', '#8AD6A8', ['#8AD6A8', '#2F6A62', '#B7E6B0', '#4E9A78']] : ['#B98858', '#8E6244', '#D9B27A', ['#D9B27A', '#8E6244', '#E8CC96', '#A87850']];   // second game: a nest woven from vines
  if (glow > 0) { const gg = c.createRadialGradient(x, y, r * 0.4, x, y, r * 2.2); gg.addColorStop(0, 'rgba(255,224,140,' + 0.55 * glow + ')'); gg.addColorStop(1, 'rgba(255,224,140,0)'); c.fillStyle = gg; c.beginPath(); c.arc(x, y, r * 2.2, 0, TAU); c.fill(); }
  wash(c, x - r * 0.12, y + r * 0.2, r * 1.1, r * 0.75, SHADOW, { a: 0.3, seed: seed, edge: 0 });
  wash(c, x, y, r, r * 0.72, N[0], { a: 1, seed: seed + 1, wob: 0.08, n: 16 });
  wash(c, x, y - r * 0.04, r * 0.72, r * 0.46, N[1], { a: 0.9, seed: seed + 2, wob: 0.08, edge: 0 });
  wash(c, x, y, r * 0.6, r * 0.36, N[2], { a: 0.6, seed: seed + 3, edge: 0 });
  const rr = rng(seed);
  c.lineCap = 'round';
  for (let i = 0; i < 70; i++) {
    const a = rr() * TAU, d = 0.72 + rr() * 0.3, l = 0.25 + rr() * 0.3;
    c.strokeStyle = rgba(N[3][i % 4], 0.7); c.lineWidth = 2 + rr() * 2.5;
    c.beginPath(); c.moveTo(x + Math.cos(a) * r * d, y + Math.sin(a) * r * d * 0.72);
    c.quadraticCurveTo(x + Math.cos(a + l * 0.5) * r * (d + 0.08), y + Math.sin(a + l * 0.5) * r * (d + 0.08) * 0.72, x + Math.cos(a + l) * r * d, y + Math.sin(a + l) * r * d * 0.72); c.stroke();
  }
}
/* Small painted icons for hints (no words needed). */
function iconArrow(c, x, y, ang, size, col) {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.fillStyle = rgba(SHADOW, 0.25); c.beginPath(); c.moveTo(size + 4, 5); c.lineTo(-size * 0.5 + 4, -size * 0.7 + 5); c.lineTo(-size * 0.2 + 4, 5); c.lineTo(-size * 0.5 + 4, size * 0.7 + 5); c.closePath(); c.fill();
  c.fillStyle = col; c.strokeStyle = 'rgba(255,248,226,0.9)'; c.lineWidth = size * 0.16; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(size, 0); c.lineTo(-size * 0.5, -size * 0.7); c.lineTo(-size * 0.2, 0); c.lineTo(-size * 0.5, size * 0.7); c.closePath(); c.stroke(); c.fill();
  c.restore();
}
function iconStick(c, x, y, r, t) {     // left stick: four little arrows and a wiggling cap
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; iconArrow(c, x + Math.cos(a) * r * 1.75, y + Math.sin(a) * r * 1.75, a, r * 0.42, '#F8C24E'); }
  soft(c, x + 3, y + 4, r, r, SHADOW, 0.25, 3);

  const a = t * 2.5; puff(c, x + Math.cos(a) * r * 0.3, y + Math.sin(a) * r * 0.3, r * 0.56, r * 0.56, '#8E7AA0', 5, 'rgba(90,60,90,0.4)');
}
function drawDizzyStars(c, x, y, t) {
  for (let i = 0; i < 3; i++) {
    const a = t * 5 + i * TAU / 3;
    c.fillStyle = '#FFE08A'; c.strokeStyle = 'rgba(210,140,70,0.5)'; c.lineWidth = 1.5;

}
/* The two heroes of the game being played: Bubu and Leo, or Boon and Killer. */
function drawHero(c, k, x, y, o) {
  if (isLupta()) { if (k === 0) drawBoon(c, x, y, o); else drawKiller(c, x, y, o); }
  else if (k === 0) drawBubu(c, x, y, o); else drawLeo(c, x, y, o);
}
/* The small enemy that sleeps and wakes up: a beetle, or one of George's robots. */
function drawSleeper(c, b, t) { if (isLupta()) drawRobot(c, b, t); else drawBeetle(c, b, t); }
/* The small enemy that comes down a lane: a rolling pinecone, or a sticky snail. */
function drawRoller(c, o, x, y, t) { if (isLupta()) drawSnail(c, x, y, t, o); else drawCone(c, x, y, o.rot, o.r, 0); }

/* ==========================================================================
   THE SECOND GAME, "CEA MAI GREA LUPTĂ": its characters and things.
   Everything here was invented and drawn by the children. The painters follow
   their drawings: Boon (teal dinosaur, blue spikes on the back, long tan neck,
   lime legs and tail), Killer (footballer in blue with the number 10 and red
   boots) and George cel Rău (pink dinosaur with a rainbow head and a striped
   horn-crown). Same picture-book watercolor style as the first game.
   Every draw function takes the feet position (x, y) in the current transform.
   ========================================================================== */
/* A soft tapered tube along a curve: tails, necks, arms, legs. */
function tube(c, x0, y0, cx, cy, x1, y1, r0, r1, col, col2) {
  const n = 16;
  for (let i = 0; i <= n; i++) {
    const u = i / n, v = 1 - u, x = v * v * x0 + 2 * v * u * cx + u * u * x1, y = v * v * y0 + 2 * v * u * cy + u * u * y1;
    c.fillStyle = col2 ? mix(col, col2, u) : col; c.beginPath(); c.arc(x, y, lerp(r0, r1, u), 0, TAU); c.fill();
  }
}
function clawTips(c, x, y, ang, len, n, col) {       // n little pointed claws fanning out from (x, y)
  c.fillStyle = col || '#FFF3D6';
  for (let i = 0; i < n; i++) {
    const a = ang + (i - (n - 1) / 2) * 0.42, bx = Math.cos(a + Math.PI / 2) * len * 0.22, by = Math.sin(a + Math.PI / 2) * len * 0.22;
    c.beginPath(); c.moveTo(x + bx, y + by); c.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); c.lineTo(x - bx, y - by); c.closePath(); c.fill();
  }
}

/* BOON: the little one's hero. Round teal body, a dome of blue spikes on the back, long tan neck, small blue head,
   lime legs and a long lime tail. o.claw (0 to 1) = the claws are out and spinning. */
function drawBoon(c, x, y, o) {
  const s = o.scale || 1, f = o.face || 1, t = o.t || 0;
  const step = o.moving ? Math.sin(o.walk || 0) : 0, hop = o.moving ? Math.abs(step) * 6 : 0;
  const br = Math.sin(t * 2.4) * 0.025 * (o.moving ? 0.3 : 1), sq = o.squash || 0, claw = o.claw != null && o.claw >= 0;
  const teal = '#3DBDB4', tealD = '#2B9A9E', lime = '#B7D645', limeD = '#8FB436', tan = '#CFA052', blue = '#3F78D8', navy = '#56609E', lilac = '#C4BEDC';
  c.save(); c.translate(x, y - (o.z || 0) * s); c.scale(s * f, s);
  // tail: thick at the body, down to the ground, long
  const wag = Math.sin(t * 3.1) * 4;
  tube(c, -30, -30, -52, -30, -58, -10 + wag * 0.3, 11, 8, lime);
  tube(c, -58, -10 + wag * 0.3, -62, 2, -92, -4 + wag, 8, 4.5, lime, limeD);
  // legs with little claws
  const leg = (lx, lift, fwd) => {
    tube(c, lx, -26, lx + fwd * 0.4, -16 - lift * 0.5, lx + fwd, -6 - lift, 6.5, 5.5, lime, limeD);
    clawTips(c, lx + fwd + 4, -4 - lift, 0.15, 9, 3, '#FFF3D6');
  };
  leg(-14, Math.max(0, step) * 6, step * 7); leg(12, Math.max(0, -step) * 6, -step * 7);
  c.translate(0, -hop); c.scale(1 + br + sq, 1 - br - sq);
  // the dome on the back with three blue spikes ("mountains") and their pale tips
  c.beginPath(); c.moveTo(-40, -40); c.bezierCurveTo(-40, -124, 30, -128, 32, -40); c.closePath();
  let g = c.createLinearGradient(0, -106, 0, -40); g.addColorStop(0, shade(tealD, 0.15)); g.addColorStop(1, tealD);
  c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(40,110,120,0.3)'; c.lineWidth = 2.2; c.stroke();
  const spikes = [[-35, -9, -21, -91], [-13, 15, 1, -99], [9, 29, 19, -88]];
  for (const sp of spikes) {
    c.fillStyle = blue; c.beginPath(); c.moveTo(sp[0], -44); c.lineTo(sp[2], sp[3]); c.lineTo(sp[1], -44); c.closePath(); c.fill();
    c.fillStyle = lilac; c.beginPath(); c.moveTo(lerp(sp[0], sp[2], 0.7), lerp(-44, sp[3], 0.7)); c.lineTo(sp[2], sp[3]); c.lineTo(lerp(sp[1], sp[2], 0.7), lerp(-44, sp[3], 0.7)); c.closePath(); c.fill();
  }
  // body
  g = c.createRadialGradient(8, -46, 6, 0, -34, 48); g.addColorStop(0, shade(teal, 0.4)); g.addColorStop(0.55, teal); g.addColorStop(1, tealD);
  puff(c, -2, -34, 42, 24, g, 1, 'rgba(40,110,120,0.3)');
  soft(c, 6, -26, 26, 11, '#BFF0E4', 0.45, 2);
  // neck
  tube(c, 28, -40, 37, -78, 34, -116, 10.5, 8.5, tan, shade(tan, 0.15));
  soft(c, 31, -80, 4, 30, shade(tan, 0.4), 0.5, 3);
  // arm: short normally; long, with long claws, when the power is on
  const reach = claw ? 26 : 0, ay = -50 + (o.moving ? step * 2 : 0);
  tube(c, 28, -48, 40 + reach * 0.5, ay - 6, 46 + reach, ay, 5.5, 5, '#4A9FE0');
  soft(c, 48 + reach, ay, 7, 6, '#4A9FE0', 1, 5);
  clawTips(c, 52 + reach, ay, 0, claw ? 26 : 9, 3, claw ? '#FFFBEA' : '#EAF2FF');
  if (o.hug > 0) for (let i = 0; i < 3; i++) { heartPath(c, 62 + i * 14, ay - 20 - i * 12 - (1 - o.hug) * 30, 6); c.fillStyle = rgba('#F29C9C', o.hug); c.fill(); }
  // head: round and blue, with a darker snout
  c.translate(0, -16);
  puff(c, 30, -110, 14, 13, blue, 6, 'rgba(50,70,150,0.3)');
  puff(c, 47, -107, 14, 9, navy, 7, 'rgba(50,50,110,0.3)');
  soft(c, 26, -116, 6, 4, shade(blue, 0.45), 0.7, 8);
  drawEye(c, 36, -112, 6.5, o, 1);
  c.strokeStyle = '#2F3566'; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath();
  if (o.dizzy) { c.moveTo(44, -101); c.quadraticCurveTo(48, -104, 52, -101); c.quadraticCurveTo(55, -98, 58, -101); } else c.arc(50, -105, 6, 0.25, Math.PI * 0.8);
  c.stroke();
  c.fillStyle = 'rgba(47,53,102,0.7)'; c.beginPath(); c.arc(57, -110, 1.4, 0, TAU); c.fill();
  c.restore();
}

/* KILLER: the big one's hero. A footballer all in blue, number 10, big red boots, a round head with big eyes and a wide grin. */
function drawKiller(c, x, y, o) {
  const s = o.scale || 1, f = o.face || 1, t = o.t || 0;
  const step = o.moving ? Math.sin(o.walk || 0) : 0, hop = o.moving ? Math.abs(step) * 6 : 0;
  const br = Math.sin(t * 2.6 + 1) * 0.022 * (o.moving ? 0.3 : 1), sq = o.squash || 0, kick = o.kick || 0;
  const skin = '#F6D2AE', kit = '#2F6FD0', kitD = '#2456A8', boot = '#E4583C', ink = '#243A7A', up = o.happy || o.hug > 0;
  c.save(); c.translate(x, y - (o.z || 0) * s); c.scale(s * f, s);
  // legs in blue, big red boots
  const leg = (lx, lift, fwd, seed) => {
    tube(c, lx, -32, lx + fwd * 0.4, -22 - lift * 0.5, lx + fwd * 0.8, -11 - lift, 5.5, 5, skin);
    tube(c, lx, -34, lx + fwd * 0.15, -29 - lift * 0.2, lx + fwd * 0.35, -22 - lift * 0.45, 7.5, 7, kit, kitD);
    puff(c, lx + fwd + 3, -5 - lift, 13, 7.5, boot, seed, 'rgba(150,50,40,0.4)');
    soft(c, lx + fwd + 6, -8 - lift, 5, 2.5, shade(boot, 0.4), 0.6, seed + 1);
  };
  leg(-10, Math.max(0, step) * 6, step * 7, 40);
  leg(10, Math.max(0, -step) * 6 + kick * 8, -step * 7 + kick * 16, 44);
  c.translate(0, -hop); c.scale(1 + br + sq, 1 - br - sq);
  // long arms, like in the drawing (up in the air when happy)
  const gl = o.glove > 0 ? o.glove : 0;                                // the whirl gloves: both arms stretch out, 2.4 times longer
  const arm = (sd, sw) => {
    if (gl > 0) {
      const ext = 1 + 1.4 * Math.min(1, gl * 4) * (gl > 0.85 ? (1 - gl) / 0.15 : 1), wob = Math.sin(t * 24 + sd * 2) * 5;
      tube(c, sd * 17, -62, sd * (26 * ext), -58 + wob * 0.4, sd * (34 * ext), -52 + wob, 6.5, 5.5, skin);
      drawGlove(c, sd * (36 * ext), -50 + wob, 13, sd, t);
    } else if (up) tube(c, sd * 17, -62, sd * 30, -74, sd * 34, -92 + Math.sin(t * 9 + sd) * 4, 6.5, 6, skin);
    else tube(c, sd * 17, -62, sd * 32, -56 + sw * 3, sd * 36, -38 + sw * 5, 6.5, 6.5, skin);
    soft(c, sd * 17, -62, 8, 6, kit, 1, 50 + sd);                      // sleeve
  };
  arm(-1, step);
  let g = c.createLinearGradient(0, -70, 0, -26); g.addColorStop(0, shade(kit, 0.2)); g.addColorStop(1, kitD);
  puff(c, 0, -46, 20, 23, g, 26, 'rgba(30,60,130,0.35)');           // shirt and shorts in one blue piece
  arm(1, -step);
  c.save(); c.scale(f, 1);                                             // the number is never mirrored
  text(c, '10', 0, -47, 21, ink, { halo: 0, shadow: 0, weight: 'bold' });
  c.restore();
  // head: round, no hair, big eyes, wide grin with teeth
  g = c.createRadialGradient(6, -100, 4, 0, -90, 30); g.addColorStop(0, shade(skin, 0.35)); g.addColorStop(1, skin);
  puff(c, 0, -92, 25, 24, g, 28, 'rgba(180,110,80,0.3)');
  soft(c, -22, -92, 4.5, 6.5, skin, 1, 29);
  drawEye(c, -5, -99, 7.5, o, 1); drawEye(c, 11, -99, 7.5, o, 1);
  soft(c, 19, -86, 5, 3.5, '#F29C8E', 0.5, 30); soft(c, -13, -85, 5, 3.5, '#F29C8E', 0.4, 31);
  if (o.dizzy) { c.strokeStyle = '#9A5440'; c.lineWidth = 2.3; c.lineCap = 'round'; c.beginPath(); c.moveTo(-6, -79); c.quadraticCurveTo(-1, -83, 3, -79); c.quadraticCurveTo(7, -75, 12, -79); c.stroke(); }
  else {
    c.fillStyle = '#FFFDF4'; c.strokeStyle = '#9A5440'; c.lineWidth = 2; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-10, -85); c.quadraticCurveTo(3, -82, 16, -85); c.quadraticCurveTo(15, -72, 3, -72); c.quadraticCurveTo(-9, -72, -10, -85); c.closePath(); c.fill(); c.stroke();
    c.lineWidth = 1.3; c.strokeStyle = 'rgba(154,84,64,0.75)'; c.beginPath(); c.moveTo(-9, -79); c.lineTo(15, -79); for (const tx of [-3, 3, 9]) { c.moveTo(tx, -84); c.lineTo(tx, -73); } c.stroke();
  }
  c.restore();
}

/* Killer's ball, like in the drawing: white, with hexagons. */
function drawBallL(c, x, y, r, spin) {
  c.save(); c.translate(x, y);
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.clip();
  const g = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 1.1); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#D6DBF8');
  c.fillStyle = g; c.fillRect(-r, -r, r * 2, r * 2);
  c.rotate(spin || 0);
  c.strokeStyle = '#4A4690'; c.lineWidth = Math.max(1.3, r * 0.12); c.lineJoin = 'round';
  for (const hx of [[-0.26, -0.1, 0.44, 0.2], [0.52, 0.34, 0.38, 0.7], [0.14, -0.9, 0.36, 0.1], [-0.72, 0.62, 0.34, 0.4]]) {
    c.beginPath();
    for (let i = 0; i < 6; i++) { const a = hx[3] + i / 6 * TAU, px = (hx[0] + Math.cos(a) * hx[2]) * r, py = (hx[1] + Math.sin(a) * hx[2]) * r; if (i === 0) c.moveTo(px, py); else c.lineTo(px, py); }
    c.closePath(); c.fillStyle = 'rgba(90,120,224,0.22)'; c.fill(); c.stroke();
  }
  c.restore();
  c.strokeStyle = 'rgba(74,70,144,0.6)'; c.lineWidth = 1.8; c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke();
}

/* GEORGE CEL RĂU: a carnotaurus with a crown. Pink body, a head in rainbow colors with a blue snout full of teeth,
   a striped horn-crown, thin brown legs and arms, a tail that turns from green to blue.
   mood: calm | angry | dizzy | scared */
function drawGeorge(c, x, y, o) {
  const s = o.scale || 1, f = o.face || 1, t = o.t || 0, mood = o.mood || 'calm';
  const step = o.moving ? Math.sin(o.walk || 0) : 0, hop = o.moving ? Math.abs(step) * 5 : 0, sq = o.squash || 0;
  const pink = '#E45AA0', pinkD = '#C2417F', brown = '#9A6B3C', eo = { t: t, dizzy: mood === 'dizzy', blinkOff: 0.9 };
  c.save(); c.translate(x, y); c.scale(s * f, s);
  // tail: green at the body, then blue, curling up
  const wag = Math.sin(t * 3.4) * 5;
  tube(c, -36, -40, -70, -34, -84, -52 + wag * 0.4, 12, 9, '#A8D645', '#6FC96A');
  tube(c, -84, -52 + wag * 0.4, -98, -74 + wag, -78, -94 + wag, 9, 4.5, '#46A8D8', '#3F78D8');
  c.strokeStyle = 'rgba(40,60,120,0.45)'; c.lineWidth = 2; c.lineCap = 'round';
  for (let i = 0; i < 3; i++) { const yy = -70 - i * 8 + wag * 0.8; c.beginPath(); c.moveTo(-96 + i * 4, yy); c.lineTo(-88 + i * 4, yy - 3); c.stroke(); }
  // thin brown legs: a pink foot behind, a pale claw foot in front
  tube(c, -14 + step * 5, -26, -14 + step * 6, -14, -14 + step * 8, -5 - Math.max(0, step) * 5, 4.5, 4, brown);
  soft(c, -11 + step * 8, -3 - Math.max(0, step) * 5, 10, 6, '#E77AB4', 1, 61);
  tube(c, 14 - step * 5, -26, 14 - step * 6, -14, 15 - step * 8, -5 - Math.max(0, -step) * 5, 4.5, 4, brown);
  clawTips(c, 18 - step * 8, -3 - Math.max(0, -step) * 5, 0.2, 15, 3, '#DCD6EC');
  c.translate(0, -hop); c.scale(1 + sq, 1 - sq);
  // body
  let g = c.createRadialGradient(10, -62, 6, 0, -46, 54); g.addColorStop(0, shade(pink, 0.4)); g.addColorStop(0.55, pink); g.addColorStop(1, pinkD);
  puff(c, 0, -46, 46, 31, g, 60, 'rgba(150,40,100,0.35)');
  c.strokeStyle = 'rgba(255,220,236,0.4)'; c.lineWidth = 5; c.lineCap = 'round';

  tube(c, 12, -32, 18, -30, 22, cheer ? -52 : -30, 4, 3.5, body);

}

/* One goalkeeper glove: red, white palm, a blue star in the palm. sd = which side it points to. */
function drawGlove(c, x, y, r, sd, t) {
  c.save(); c.translate(x, y); c.rotate(sd * 0.25 + Math.sin((t || 0) * 18) * 0.12); c.scale(sd, 1);
  soft(c, 1, r * 0.2, r, r * 0.95, SHADOW, 0.22, 7);
  puff(c, 0, 0, r, r * 0.95, '#E4583C', 8, 'rgba(150,50,40,0.45)');          // the glove
  puff(c, r * 0.18, r * 0.05, r * 0.6, r * 0.62, '#FFF6E2', 9, 'rgba(200,150,120,0.35)');   // the white palm
  c.save(); c.translate(r * 0.18, r * 0.05); c.fillStyle = '#3B6FE0'; starPath(c, 0, 0, r * 0.4, 0.3); c.fill(); c.restore();
  puff(c, -r * 0.62, -r * 0.42, r * 0.34, r * 0.46, '#E4583C', 10, 'rgba(150,50,40,0.4)');  // the thumb
  soft(c, -r * 0.1, -r * 0.72, r * 0.7, r * 0.2, shade('#E4583C', 0.35), 0.5, 11);          // the cuff

}

/* Boon's boomerang bone: two round ends and a shaft, cream amber, with a small crack. */
function drawBone(c, x, y, r, spin) {
  c.save(); c.translate(x, y); c.rotate(spin || 0);
  const L = r * 1.25, w = r * 0.42, col = '#F3E2B8', sh = '#C99A52';
  soft(c, 0, w * 0.5, L, w * 0.8, SHADOW, 0.2, 3);
  c.fillStyle = col; c.strokeStyle = rgba(sh, 0.75); c.lineWidth = Math.max(1.5, r * 0.1); c.lineJoin = 'round';
  c.beginPath(); c.moveTo(-L * 0.55, -w * 0.5); c.lineTo(L * 0.55, -w * 0.5); c.lineTo(L * 0.55, w * 0.5); c.lineTo(-L * 0.55, w * 0.5); c.closePath(); c.fill();
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) { c.beginPath(); c.arc(sx * L * 0.62, sy * w * 0.62, w * 0.72, 0, TAU); c.fill(); }
  c.beginPath(); c.moveTo(-L * 0.3, -w * 0.18); c.lineTo(L * 0.1, -w * 0.05); c.stroke();        // the crack
  c.fillStyle = rgba('#FFFDF4', 0.6); c.beginPath(); c.ellipse(-L * 0.1, -w * 0.3, L * 0.3, w * 0.16, 0, 0, TAU); c.fill();
  c.restore();
}

function drawThrown(c, x, y, r, spin, look) {

}

function spline(pts, stepLen) {          // Catmull-Rom through points, resampled evenly
  const raw = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let k = 0; k < 24; k++) {
      const t = k / 24, t2 = t * t, t3 = t2 * t;
      raw.push([0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
                0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
    }
  }
  raw.push(pts[pts.length - 1]);
  const out = [raw[0]]; let acc = 0;
  for (let i = 1; i < raw.length; i++) {
    acc += dist(raw[i][0], raw[i][1], raw[i - 1][0], raw[i - 1][1]);
    if (acc >= stepLen) { out.push(raw[i]); acc = 0; }
  }
  out.push(raw[raw.length - 1]);
  return out;
}

function genLevel(idx, seed) {
  const def = levelDef(idx), r = rng(seed), WW = 3200, WH = 1800, cols = WW / CS, rows = WH / CS;
  const NW = clamp(CONFIG.wavesPerLevel | 0, 1, 5);
  const top = def.cliff ? 520 : 280;
  const L = { idx, def, seed, night: !!def.night, W: WW, H: WH, cols, rows, top, skyH: def.cliff ? 160 : 280, pal: PALS[def.pal], skyT: skyTOf(idx),
    grid: new Uint8Array(cols * rows), flag: new Uint8Array(cols * rows), solids: [], trees: [], dynTrees: [], beetles: [], lanes: [], cones: [],
    bridges: [], stones: [], mills: [], lanterns: [], stars: [], waves: [], waterCells: [], sprites: [],
    spawn: { x: 240, y: 1080 }, nest: { x: 2950, y: 1040 }, NW, minZoom: 0.6 };
  const G = L.grid, F = L.flag;       // F bits: 1 no trees, 2 no eggs, 4 cave, 8 bridge, 16 lane
  const inW = (cx, cy) => cx >= 0 && cy >= 0 && cx < cols && cy < rows;
  const ci = (x, y) => clamp(y / CS | 0, 0, rows - 1) * cols + clamp(x / CS | 0, 0, cols - 1);
  const mark = (x, y, rad, bits) => {
    for (let cy = (y - rad) / CS | 0; cy <= (y + rad) / CS; cy++) for (let cx = (x - rad) / CS | 0; cx <= (x + rad) / CS; cx++)
      if (inW(cx, cy) && dist((cx + 0.5) * CS, (cy + 0.5) * CS, x, y) <= rad + 20) F[cy * cols + cx] |= bits;
  };
  const region = k => [k * WW / NW, (k + 1) * WW / NW];
  const dv = (arr, k) => arr[Math.min(arr.length - 1, Math.floor(k * arr.length / NW))];
  const starRegion = i => Math.min(NW - 1, Math.floor(i * NW / 3));
  for (let cy = 0; cy < top / CS; cy++) for (let cx = 0; cx < cols; cx++) G[cy * cols + cx] = 3;

  // ---- the path from the start to the nest ----------------------------------
  const py = def.pathY || [740, 1380];
  let wps;
  if (def.river) {
    const Y = lerp(py[0] + 60, py[1] - 60, r());
    wps = [[L.spawn.x, L.spawn.y], [720 + r() * 120, lerp(py[0], py[1], r())], [1230, Y], [1970, Y], [2480 + r() * 120, lerp(py[0], py[1], r())], [L.nest.x, L.nest.y]];
    L.bridgeY = Y;
  } else {
    wps = [[L.spawn.x, L.spawn.y]];
    for (let i = 1; i <= 4; i++) wps.push([L.spawn.x + (L.nest.x - L.spawn.x) * i / 5 + (r() - 0.5) * 160, lerp(py[0], py[1], r())]);
    wps.push([L.nest.x, L.nest.y]);
  }
  L.path = spline(wps, 26);
  const pathDist = (x, y) => { let m = 1e9; for (let i = 0; i < L.path.length; i += 3) { const d = dist(x, y, L.path[i][0], L.path[i][1]); if (d < m) m = d; } return m; };
  for (const p of L.path) mark(p[0], p[1], 78, 1);
  mark(L.spawn.x, L.spawn.y, 210, 3); mark(L.nest.x, L.nest.y, 200, 3);

  // ---- water ----------------------------------------------------------------
  const setWater = (cx, cy) => { if (inW(cx, cy) && G[cy * cols + cx] === 0) G[cy * cols + cx] = 2; };
  if (def.cliff) {
    for (let cy = 6; cy <= 10; cy++) for (let cx = 36; cx <= 43; cx++) { G[cy * cols + cx] = 0; F[cy * cols + cx] |= 7; }
    for (let cy = 11; cy <= 12; cy++) for (let cx = 39; cx <= 41; cx++) { G[cy * cols + cx] = 0; F[cy * cols + cx] |= 7; }
    for (let cy = 13; cy <= 15; cy++) for (let cx = 0; cx < cols; cx++) F[cy * cols + cx] |= 1;
    for (let cy = 16; cy < 24; cy++) for (let cx = 0; cx < cols; cx++) {
      const nx = ((cx + 0.5) * CS - 1620) / 330, ny = ((cy + 0.5) * CS - 790) / 132;
      if (nx * nx + ny * ny < 1) setWater(cx, cy);
    }
    if (def.door) L.vines = { x: 1620, w: 290, y0: 150, y1: 520 };    // second game: a curtain of vines hides the door to the hideout
    else L.fall = { x: 1620, w: 250, y0: 160, y1: 668 };
    L.cave = { x0: 1440, y0: 240, x1: 1760, y1: 520, reveal: 0, egg: { x: 1600, y: 335 } };
    L.cover = { x: 1400, y: 215, w: 400, h: 310 };
  }
  if (def.river) {
    const ph = r() * 6, ph2 = r() * 6;
    L.riverX = def.river === 'fall' ? (y => 1620 + 150 * Math.sin((y - 840) / 270)) : (y => 1600 + 180 * Math.sin(y / 310 + ph) + 50 * Math.sin(y / 120 + ph2));
    const y0 = def.river === 'fall' ? 840 : top;
    for (let cy = y0 / CS | 0; cy < rows; cy++) {
      const yc = (cy + 0.5) * CS, rx = L.riverX(yc);
      for (let cx = 0; cx < cols; cx++) if (Math.abs((cx + 0.5) * CS - rx) < 78) setWater(cx, cy);
    }
    const crossing = (by, list) => {
      const row0 = Math.round((by - 60) / CS), yc = (row0 + 1.5) * CS, bx = L.riverX(yc);
      for (let cy = row0; cy < row0 + 3; cy++) for (let cx = (bx - 160) / CS | 0; cx <= (bx + 160) / CS; cx++)
        if (inW(cx, cy)) { const i = cy * cols + cx; if (G[i] === 2) G[i] = 0; F[i] |= 9; }
      list.push({ x: bx, y: yc, w: 320, h: 120 });
      return yc;
    };
    L.crossY = [crossing(L.bridgeY, L.bridges)];
    for (const y of [top + 190, WH - 200]) if (Math.abs(y - L.bridgeY) > 330 && !(def.river === 'fall' && y < 900)) L.crossY.push(crossing(y, L.stones));
  }

  const pathFar = (x, y, d) => pathDist(x, y) >= d;
  const areaClear = (x, y, rad) => {
    for (let cy = (y - rad) / CS | 0; cy <= (y + rad) / CS; cy++) for (let cx = (x - rad) / CS | 0; cx <= (x + rad) / CS; cx++) {
      if (!inW(cx, cy)) return false;

  };
  const addSolid = (x, y, rad, kind, extra) => { const s = Object.assign({ x, y, r: rad, kind, seed: r() * 1000 }, extra || {}); L.solids.push(s); return s; };
  const mudEllipse = (x, y, rx, ry) => {
    for (let cy = (y - ry) / CS | 0; cy <= (y + ry) / CS; cy++) for (let cx = (x - rx) / CS | 0; cx <= (x + rx) / CS; cx++) {
      if (!inW(cx, cy)) continue;
      const i = cy * cols + cx, nx = ((cx + 0.5) * CS - x) / rx, ny = ((cy + 0.5) * CS - y) / ry;
      if (nx * nx + ny * ny < 1 + (hash(x, cx * 7 + cy) - 0.5) * 0.35 && G[i] === 0 && !(F[i] & 14)) G[i] = 1;
    }
  };

  // ---- bonus stars: one per third of the map --------------------------------
  const kinds = def.stars.slice(0, clamp(CONFIG.starsPerLevel | 0, 0, 3));
  let guardSpots = [];
  for (let si = 0; si < kinds.length; si++) {
    const k = starRegion(si), [x0, x1] = region(k); let kind = kinds[si], done = false;
    if (kind === 'islet') {
      if (def.cliff) { L.stars.push({ x: 1620, y: 800, kind }); done = true; }
      else if (def.river) {
        for (let t = 0; t < 60 && !done; t++) {
          const y = top + 220 + r() * (WH - top - 440);
          if (L.crossY.every(cy => Math.abs(cy - y) > 250)) { L.stars.push({ x: L.riverX(y), y, kind }); done = true; }
        }
      } else if (def.pond) {
        for (let t = 0; t < 120 && !done; t++) {
          const rx = 190, ry = 130, x = lerp(x0 + rx + 70, x1 - rx - 70, r()), y = lerp(top + ry + 100, WH - ry - 100, r());
          if (!pathFar(x, y, rx + 150) || dist(x, y, L.spawn.x, L.spawn.y) < 460 || dist(x, y, L.nest.x, L.nest.y) < 460) continue;
          for (let cy = (y - ry) / CS | 0; cy <= (y + ry) / CS; cy++) for (let cx = (x - rx) / CS | 0; cx <= (x + rx) / CS; cx++) {
            const nx = ((cx + 0.5) * CS - x) / rx, ny = ((cy + 0.5) * CS - y) / ry;
            if (nx * nx + ny * ny < 1) setWater(cx, cy);
          }
          mark(x, y, rx + 50, 1);
          L.stars.push({ x, y, kind }); done = true;
        }
      }
      if (!done) kind = 'guarded';
    }
    if (kind === 'nook') {
      for (let t = 0; t < 120 && !done; t++) {
        const x = lerp(x0 + 250, x1 - 250, r()), y = r() < 0.5 ? top + 250 + r() * 90 : WH - 260 - r() * 70;
        if (!pathFar(x, y, 330) || !areaClear(x, y, 215)) continue;
        const gap = r() * TAU, n = 7, span = TAU - 1.6;
        for (let i = 0; i < n; i++) { const a = gap + 0.8 + i * span / (n - 1); addSolid(x + Math.cos(a) * 150, y + Math.sin(a) * 150, 44, 'rock'); }
        mark(x, y, 240, 3);
        L.stars.push({ x, y, kind, check: true });
        if (idx > 0) guardSpots.push({ x: x + 50, y: y - 20, n: 1, rad: 0 });
        done = true;
      }
      if (!done) kind = 'guarded';
    }
    if (kind === 'guarded') {
      for (let t = 0; t < 200 && !done; t++) {
        const x = lerp(x0 + 180, x1 - 180, r()), y = lerp(top + 200, WH - 200, r());
        if (!pathFar(x, y, 260) || !areaClear(x, y, 150) || dist(x, y, L.spawn.x, L.spawn.y) < 420) continue;
        mark(x, y, 170, 1);
        if (def.mud.some(m => m > 0)) mudEllipse(x, y, 160, 120);
        L.stars.push({ x, y, kind, check: true });
        guardSpots.push({ x, y, n: idx >= 1 ? (idx >= 3 ? 3 : 2) : 0, rad: 125 });

  // ---- mud, pinecone lanes, windmills ---------------------------------------
  for (let k = 0; k < NW; k++) {
    const [x0, x1] = region(k);
    for (let m = 0, t = 0; m < dv(def.mud, k) && t < 80; t++) {
      const x = lerp(x0 + 100, x1 - 100, r()), y = lerp(top + 150, WH - 150, r());
      if (dist(x, y, L.spawn.x, L.spawn.y) < 330 || dist(x, y, L.nest.x, L.nest.y) < 300) continue;

      if (!ok) continue;

      if (inW(cx, cy) && dist((cx + 0.5) * CS, (cy + 0.5) * CS, s.x, s.y) < rad) blocked[cy * cols + cx] = 1;
  }

  while (q.length) {

  // ---- beetles ---------------------------------------------------------------

  for (const gs of guardSpots) for (let j = 0; j < gs.n; j++) {
    const a = r() * TAU + j * TAU / Math.max(1, gs.n), x = gs.x + Math.cos(a) * gs.rad, y = gs.y + Math.sin(a) * gs.rad;
    if (reach[ci(x, y)]) addBeetle(x, y);
  }
  for (let k = 0; k < NW; k++) {
    const [x0, x1] = region(k);
    for (let m = 0, t = 0; m < dv(def.beetles, k) && t < 400; t++) {
      const x = lerp(x0 + 60, x1 - 60, r()), y = lerp(top + 80, WH - 80, r()), i = ci(x, y);
      if (!reach[i] || (F[i] & 22) || G[i] !== 0) continue;
      if (dist(x, y, L.spawn.x, L.spawn.y) < 380 || dist(x, y, L.nest.x, L.nest.y) < 280 || !pathFar(x, y, 105)) continue;
      if (L.beetles.some(b => dist(b.x, b.y, x, y) < 230)) continue;
      addBeetle(x, y); m++;
    }
  }

  // ---- sparkling trees (hide eggs) and the treetop star ----------------------
  for (let k = 0; k < NW; k++) {
    const [x0, x1] = region(k);
    const cand = shuffle(L.trees.filter(t => t.x >= x0 && t.x < x1 && !t.spark && pathDist(t.x, t.y) < 560));
    let n = dv(def.sparkle, k);
    for (const t of cand) {
      if (n <= 0) break;
      const cells = shuffle(reachCells(t.cx, t.cy, t.cr + 55, t.cr + 190, 6));
      if (cells.length < 4) continue;
      const cnt = 2 + (r() < 0.5 ? 1 : 0);
      t.spark = { wave: k, n: cnt, targets: cells.slice(0, cnt), done: false }; t.dyn = true; n--;
    }
  }
  for (const s of L.stars) if (s.kind === 'treetop') {
    const [x0, x1] = region(s.region);
    const cand = shuffle(L.trees.filter(t => t.x >= x0 && t.x < x1 && !t.spark && !t.starTree));
    let ok = false;
    for (const t of cand) {
      const cells = shuffle(reachCells(t.cx, t.cy, t.cr + 55, t.cr + 170, 6));
      if (!cells.length) continue;
      t.starTree = s; t.dyn = true; s.tree = t; s.x = cells[0].x; s.y = cells[0].y; ok = true; break;
    }
    if (!ok) { const cells = shuffle(reachCells((x0 + x1) / 2, (top + WH) / 2, 0, 700, 6)).filter(c2 => pathFar(c2.x, c2.y, 300)); if (!cells.length) return null; s.kind = 'guarded'; s.hidden = false; s.x = cells[0].x; s.y = cells[0].y; }
  }
  L.dynTrees = L.trees.filter(t => t.dyn);

  // ---- golden eggs, in waves from left to right ------------------------------
  const total = Math.max(NW, Math.round(CONFIG.levelDuration / 60 * CONFIG.eggsPerMinute)), quota = Math.round(total / NW);
  L.totalEggs = 0;
  for (let k = 0; k < NW; k++) {
    const [x0, x1] = region(k), pts = [];
    const sparkN = L.trees.reduce((a, t) => a + (t.spark && t.spark.wave === k ? t.spark.n : 0), 0);
    const ground = Math.max(2, quota - sparkN), trailN = Math.round(ground * 0.4);
    const far = (x, y, d) => pts.every(p => dist(p.x, p.y, x, y) >= d);
    const seg = L.path.filter(p => p[0] > x0 + 50 && p[0] < x1 - 50 && dist(p[0], p[1], L.spawn.x, L.spawn.y) > 240 && dist(p[0], p[1], L.nest.x, L.nest.y) > 180);

  if (def.lanterns) {

      const p = L.path[i], p2 = L.path[i + 1], dx = p2[0] - p[0], dy = p2[1] - p[1], d = Math.hypot(dx, dy) || 1;
      const x = p[0] - dy / d * 82 * side, y = p[1] + dx / d * 82 * side;
      if (G[ci(x, y)] === 0 && dist(x, y, L.nest.x, L.nest.y) > 200) L.lanterns.push({ x, y, lit: 0 });
    }
  }
  for (let i = 0; i < G.length; i++) if (G[i] === 2) L.waterCells.push(i);
  if (def.birds) { L.birds = []; for (let i = 0; i < def.birds; i++) L.birds.push({ state: 'gone', t: 6 + i * 7 + r() * 4, x: 0, y: 0, dir: 1, hp: 2, wing: 0, rest: 0, grab: null }); }   // big birds come later, one after the other
  L.reachCells = reachCells; L.ci = ci; L.pathDist = pathDist;
  L.decor = makeDecor(L, L.seed);

}

/* ---------------- painting ---------------- */
/* ---------- decor: the small things of the meadow (update U6) ----------

   leaves, snails, ladybugs, mushrooms, pebbles, bushes, twigs, moss. All of them are painted once
   into the level picture (L.bg). Grass, clover, daisies, reeds, dandelions and leaves react with
   small puffs of leaves, petals or seeds and a rustle (updateDecor). Snails and ladybugs move, so
   they are drawn live every frame, but only the ones on screen. Nothing here blocks a hero. */

const DECOR_REACT = { grass: 'puff', clover: 'puff', daisy: 'puff', reed: 'puff', dandelion: 'puff', leaf: 'puff', snail: 'hide', ladybug: 'fly' };

const DECOR_WEIGHT_L = { fern: 6, orchid: 3, glowcap: 2, bellflower: 2, puffball: 2, bigleaf: 1, glowworm: 1, firefly: 1, gem: 14, bolt: 12, root: 12, mossglow: 12, pawprint: 12 };
const DECOR_REACT_L = { fern: 'puff', orchid: 'puff', glowcap: 'puff', bellflower: 'puff', puffball: 'puff', bigleaf: 'puff', glowworm: 'hide', firefly: 'fly' };

  const r = rng(seed + 555), out = [], types = Object.keys(WT), total = types.reduce((a, t) => a + WT[t], 0);
  const pickType = () => { let x = r() * total; for (const t of types) { x -= WT[t]; if (x < 0) return t; } return types[0]; };
  let tries = 0;
  while (out.length < CONFIG.decorPerLevel && tries++ < CONFIG.decorPerLevel * 8) {

    const g = L.grid[L.ci(x, y)]; if (g === 2 || g === 3) continue;                    // no decor in water or on the cliff
    if (dist(x, y, L.nest.x, L.nest.y) < 180) continue;
    let bad = false; for (const s of L.solids) if (dist(x, y, s.x, s.y) < s.r + 12) { bad = true; break; }
    if (bad) continue;

/* ==========================================================================
   GAMEPLAY: heroes, powers, eggs, stars, enemies, wind, butterfly, boss
   ========================================================================== */
const Game = { state: 'boot', t: 0, levelIdx: 0, team: { eggs: 0, stars: 0 }, results: [], diff: CONFIG.defaultDifficulty.slice(), paused: false };
let P = null;                                   // everything about the level being played
const D = k => CONFIG.difficulty[Game.diff[k]] || CONFIG.difficulty.normal;
const rank = k => Game.diff[k] === 'easy' ? 0 : Game.diff[k] === 'hard' ? 2 : 1;      // 0 Ușor, 1 Normal, 2 Greu
/* The two abilities of this game. Any hero can have any of them, on either button (CONFIG: power = ✕, power2 = □).
   - 'spin'  turns around the hero: Boon's claws, Killer's gloves. Bubu's stomp is the same ability with time 0.
   - 'throw' sends things out in a circle: Leo's and Killer's balls, Boon's bones.
   abil gives the numbers of one ability for one hero: his own block if he has one, else the old names on the hero. */
function abil(k, kind) {
  const c = CONFIG.heroes[k];
  if (kind === 'spin') return c.spin || { radius: c.stompRadius, pull: c.pullRadius, cooldown: c.stompCooldown, stun: c.stunTime, time: c.spinTime || 0, look: c.spinTime ? 'claws' : 'stomp' };
  return c.throw || { speed: c.kickSpeed, speedMax: c.kickSpeedMax, charge: c.chargeTime, n: c.ballsPerKick, nMax: c.ballsPerKickMax, cooldown: c.kickCooldown, life: c.ballLife, lifeMax: c.ballLifeMax, look: 'ball' };
}
const hasAbil = (k, kind) => CONFIG.heroes[k].power === kind || CONFIG.heroes[k].power2 === kind;
/* Which button an ability sits on for this hero: 1 = ✕ (the first power), 2 = □ (the second). Decides the word and the hint. */

    for (let j = P.eggs.length - 1; j >= 0; j--) { const e = P.eggs[j]; if (e.state === 'idle' && e.delay <= 0 && !(e.wait > 0) && dist(e.x, e.y, b.x, b.y) < e.r + b.r + 20) collectEgg(e, b.owner); }
    for (const s of P.stars) if (!s.got && !s.hidden && !s.pop && dist(s.x, s.y, b.x, b.y) < 26 + b.r + 16) collectStar(s, b.owner);

function updateEggs(dt) {
  const L = P.L, help = P.time > CONFIG.levelDuration ? 1.5 : 1;

    const e = P.eggs[i];

    if (e.state === 'fall') { e.t += dt; const u = e.t / 0.5; e.z = u < 1 ? 300 * (1 - u) * (1 - u) : Math.sin(Math.min(1, (e.t - 0.5) / 0.18) * Math.PI) * 14; if (e.t >= 0.68) { e.state = 'idle'; e.z = 0; } continue; }
    if (e.state === 'pop') { e.t += dt; const u = Math.min(1, e.t / 0.6); e.x = lerp(e.sx, e.tx == null ? (e.tx = e.x) : e.tx, u); e.y = lerp(e.sy, e.ty == null ? (e.ty = e.y) : e.ty, u); e.z = Math.sin(u * Math.PI) * 90; if (u >= 1) { e.state = 'idle'; e.z = 0; } continue; }

      const dx = e.pull.x - e.x, dy = e.pull.y - e.y, m = Math.hypot(dx, dy) || 1, sp = 540 * dt;
      e.x += dx / m * Math.min(m, sp); e.y += dy / m * Math.min(m, sp);

    if (s.got || s.hidden) continue;
    if (s.pop) { s.pop += dt; const u = Math.min(1, s.pop / 0.7); s.x = lerp(s.sx, s.tx, u); s.y = lerp(s.sy, s.ty, u); s.z = Math.sin(u * Math.PI) * 110; if (u >= 1) { s.pop = 0; s.z = 0; } continue; }
    for (const h of P.heroes) if (h.dizzy <= 0 && !h.carried && dist(h.x, h.y, s.x, s.y) < D(h.k).pickupRadius * 0.85) { collectStar(s, h.k); break; }

}

function enemyMul(x, y) {                  // enemies slow down near a player on "Ușor"
  let m = 9;                                  // ...and speed up near a player on "Greu" (the gentlest player nearby decides)
  for (const h of P.heroes) if (dist(h.x, h.y, x, y) < 460) m = Math.min(m, Input.slots[h.k].joined ? D(h.k).enemySpeed : 1);
  return m > 8 ? 1 : m;
}
function updateEnemies(dt) {

    else if (b.state === 'knock') { b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 1 - Math.min(1, dt * 3); b.vy *= 1 - Math.min(1, dt * 3); if (b.t <= 0) { b.state = 'stun'; b.t = 3; } }
    if (b.state !== 'sleep') collide(L, b, 22, false);
    if (b.state === 'chase' || b.state === 'wake') for (const h of P.heroes) if (!h.safe && dist(h.x, h.y, b.x, b.y) < b.r + HERO_R - 8 && h.dizzy <= 0 && h.inv <= 0) { hitHero(h, b.x, b.y); b.state = 'return'; b.cool = 3; }
  }
  const cs = CONFIG.pineconeSpeed * (L.def.coneSpeed || 1);
  for (const c of L.cones) {
    c.flash = Math.max(0, (c.flash || 0) - dt);
    if (c.state === 'roll') {
      const v = cs * enemyMul(c.x, c.y) * dt; c.y += v; c.rot += v / c.r; c.fade = Math.min(1, (c.fade == null ? 1 : c.fade) + dt * 2);
      if (c.y > c.lane.y1) { c.state = 'gone'; c.t = 1.4; }
      for (const h of P.heroes) if (!h.safe && dist(h.x, h.y, c.x, c.y) < c.r + HERO_R - 6 && h.dizzy <= 0 && h.inv <= 0) {
        hitHero(h, c.x, c.y); c.state = 'gone'; c.t = 3; burst(c.x, c.y - 20, 10, { kind: 'dot', cols: ['#9C6A46', '#D6AA78'], speed: 180, life: 0.6, g: 300, size: 7 });
      }
    } else if (c.state === 'stun') { c.t -= dt; if (c.t <= 0) c.state = 'roll'; }
    else { c.t -= dt; if (c.t <= 0) { c.state = 'roll'; c.y = c.lane.y0; c.fade = 0; c.hp = CONFIG.smallEnemy.hits; } }      // a new one starts at the top of the lane
  }

/* ---------- boss: Ciori in the tallest tree (first game), George on his stone throne (second game) ---------- */

}

function updateBoss(dt) {

/* ---------- second game: big birds that pick a hero up and carry him a little way (it does not hurt) ---------- */
function hitBird(bd) {

  else { bd.rest = 3; Snd.play('stun'); }
}
function dropHero(bd) {

    let p = null, best = 1e9; for (const c of L.reachCells(h.x, h.y, 0, 360, 0)) { const dd = dist(c.x, c.y, h.x, h.y); if (dd < best) { best = dd; p = c; } }

function updateBirds(dt) {

/* The reacting decor. Grass, clover, daisies, reeds, dandelions and leaves send up a little puff of leaves,
   petals or seeds and rustle when a hero walks past (a stomp makes the dandelions and leaves jump).
   Snails pull in and a ladybug flies off and comes back. Only what is near a hero or a ball reacts. */
function updateDecor(dt) {
  const L = P.L;
  if (!L.decor) return;
  const who = [];
  for (const h of P.heroes) who.push({ x: h.x, y: h.y, stomp: (h.stompT >= 0 && h.stompT < 0.25) || h.spinT >= 0, r: abil(h.k, 'spin').radius });
  for (const f of P.flock) who.push({ x: f.x, y: f.y, stomp: false });
  P.rustleT = Math.max(0, P.rustleT - dt);
  for (const d of L.decor) {
    if (!d.react) continue;
    d.cool = Math.max(0, d.cool - dt);
    let near = 1e9, jump = false;
    for (const w of who) { const dd = dist(w.x, w.y, d.x, d.y); if (dd < near) near = dd; if (w.stomp && dd < (w.r || 0)) jump = true; }
    if (d.rk === 'hide') { const want = near < 90 ? 1 : 0; d.hide += (want - d.hide) * Math.min(1, dt * 5); }
    else if (d.rk === 'fly') {
      if (d.flyT > 0) d.flyT = Math.max(0, d.flyT - dt);
      else if (near < 60) { d.flyT = 2.2; Snd.play('pop'); }
    }
    else if (d.cool <= 0 && (jump || near < 70)) {          // a little puff, then a short rest
      d.cool = jump ? 0.9 : 0.7;
      const cols = isLupta() ? RAINBOW : d.type === 'daisy' || d.type === 'dandelion' ? PETALS : LEAVES;
      if (d.type === 'dandelion' || d.type === 'puffball') burst(d.x, d.y - 30, 10, { kind: 'dot', cols: ['#FFF8EA', '#FFFFFF'], speed: 120, life: 1.4, g: -20, up: 40, size: 5 });
      else burst(d.x, d.y - 14, jump ? 10 : 5, { kind: d.type === 'daisy' ? 'petal' : 'leaf', cols, speed: jump ? 220 : 130, life: 1.1, g: 120, up: jump ? 120 : 60, size: 9 });
      if ((d.type === 'grass' || d.type === 'fern') && P.rustleT <= 0) { P.rustleT = 0.8; Snd.play('rustle'); }
    }
  }
}

function updatePlay(dt) {

   the first game at the top of the save (as before), the second one in g2.
   Progress of a game (a "slot"):
     level    the chapter "Continue" starts (see chapters() in 06-level.js)
     max      how far the players have ever got: chapters 0 .. max are open on the Chapters screen
     results  the best result of every chapter played: { eggs, stars, med: [3 medals] }
     eggs, stars  the team total = the sum of results. Still written, so that an older version of the game can read the file. */
const emptyResult = () => ({ eggs: 0, stars: 0, med: [false, false, false] });
function sumResults(res) { const t = { eggs: 0, stars: 0 }; for (const r of res || []) if (r) { t.eggs += r.eggs | 0; t.stars += r.stars | 0; } return t; }
/* A save from before chapters (version 3 or older) becomes version 4. It changes only what is missing, so it can run again. */
function migrateSave(d) {
  if (!d || (d.v | 0) >= 4) return d;
  for (const sl of [d, d.g2]) {
    if (!sl || typeof sl !== 'object') continue;
    const lvl = Math.max(0, sl.level | 0), res = sl.results = Array.isArray(sl.results) ? sl.results : [];
    for (let i = 0; i < lvl; i++) if (!res[i]) res[i] = emptyResult();      // a level that was played must have a result (it should always have had one)
    if (sl.max == null) sl.max = lvl;
    const sum = sumResults(res), had = sl.eggs | 0;
    if (sum.eggs < had) { if (!res[0]) res[0] = emptyResult(); res[0].eggs = (res[0].eggs | 0) + had - sum.eggs; }      // the total the children saw must not get smaller
    const tt = sumResults(res); sl.eggs = tt.eggs; sl.stars = Math.max(tt.stars, sl.stars | 0);
  }
  d.v = 4; return d;
}
const Save = {
  data: null,
  load() { try { const s = localStorage.getItem(CONFIG.saveKey); this.data = s ? migrateSave(JSON.parse(s)) : null; } catch (e) { this.data = null; } return this.data; },
  slot(id) { const d = this.data; if (!d) return null; return (id || GAME) === 'lupta' ? (d.g2 || null) : d; },      // the progress of one game
  /* the progress of the chosen game, made if it is not there yet */
  own() { const d = this.data || (this.data = {}); return GAME === 'lupta' ? (d.g2 = d.g2 || {}) : d; },
  /* "New game": the progress of the chosen game is erased. The other game and the settings stay. */
  newGame() { const sl = this.own(); sl.level = 0; sl.max = 0; sl.results = []; sl.eggs = 0; sl.stars = 0; Game.results = []; this.write(); },
  /* Chapter i is over with result r. The chapter keeps its best result, "Continue" moves on only if this was the chapter it
     pointed at, and the chapters up to the next one open. */
  finish(i, r) {
    const sl = this.own(), res = sl.results = Array.isArray(sl.results) ? sl.results : [], o = res[i];
    res[i] = o ? Object.assign({}, o, { eggs: Math.max(o.eggs | 0, r.eggs | 0), stars: Math.max(o.stars | 0, r.stars | 0), med: [0, 1, 2].map(j => !!(o.med && o.med[j]) || !!(r.med && r.med[j])) })
               : { eggs: r.eggs | 0, stars: r.stars | 0, med: (r.med || []).slice(0, 3).map(Boolean) };
    for (let j = 0; j < i; j++) if (!res[j]) res[j] = emptyResult();
    const last = chapters().length - 1;
    if (i >= (sl.level | 0)) sl.level = Math.min(i + 1, last);
    sl.max = Math.max(sl.max | 0, Math.min(i + 1, last));
    const tt = sumResults(res); sl.eggs = tt.eggs; sl.stars = tt.stars;
    Game.results = res; this.write();
  },
  write() {
    const d = this.data || {};
    d.v = 4; d.game = GAME; d.diff = Game.diff; d.vol = { music: Snd.vol.music, amb: Snd.vol.amb, chr: Snd.vol.chr };
    d.opt = { lang: Opt.lang, fullscreen: Opt.fullscreen, vibration: Opt.vibration, swap: Opt.swap, ctrl: Opt.ctrl, keys: Opt.keys, guide: Opt.guide, sink: Opt.sink };
    this.data = d;
    try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(d)); } catch (e) { /* private mode */ }
  },
  /* Puts the saved settings back: language, volumes, difficulty, keys, who plays whom. */
  apply() {
    const d = this.data; if (!d) return;
    if (Array.isArray(d.diff)) for (let k = 0; k < 2; k++) if (DIFFS.indexOf(d.diff[k]) >= 0) Game.diff[k] = d.diff[k];
    const v = d.vol;
    if (v) { Snd.setVol('music', v.music); Snd.setVol('amb', v.amb != null ? v.amb : v.sfx); Snd.setVol('chr', v.chr != null ? v.chr : v.sfx); }
    const o = d.opt; if (!o) return;
    if (o.lang === 'ro' || o.lang === 'en') Opt.lang = o.lang;
    if (typeof o.fullscreen === 'boolean') Opt.fullscreen = o.fullscreen;
    if (typeof o.vibration === 'boolean') Opt.vibration = o.vibration;
    Opt.swap = !!o.swap;
    for (let k = 0; k < 2; k++) {
      if (o.ctrl && (o.ctrl[k] === 'kb' || o.ctrl[k] === 'pad')) Opt.ctrl[k] = o.ctrl[k];
      if (o.guide && typeof o.guide[k] === 'boolean') Opt.guide[k] = o.guide[k];
      if (o.sink && typeof o.sink[k] === 'string') Opt.sink[k] = o.sink[k];
      const ks = o.keys && o.keys[k];
      if (ks) for (const f of KEY_FIELDS) if (typeof ks[f] === 'string' && ks[f] && !Input.RESERVED[ks[f]]) Opt.keys[k][f] = ks[f];
    }
  },
  hasProgress(id) { const s = this.slot(id); return !!(s && s.level > 0 && s.level < chapters(id).length); },
  /* the furthest chapter open on the Chapters screen (-1: no chapter was ever finished, the button is not shown) */
  maxOpen(id) { const s = this.slot(id); return s && (s.max | 0) > 0 ? Math.min(s.max | 0, chapters(id).length - 1) : -1; }
};

/* Three little medals give the bigger player something extra to aim for. */

function drawMedal(c, i, x, y, got, t) {

    for (let k = 0; k < 8; k++) { const a = k / 8 * TAU; c.beginPath(); c.moveTo(Math.cos(a) * 17, Math.sin(a) * 17); c.lineTo(Math.cos(a) * 24, Math.sin(a) * 24); c.stroke(); }

}

/* ---------- menus: pause and settings ----------
   A menu is a list of rows. A row is one of:
     go    { label, ok() }                 a button
     opt   { label, value, chg(dir) }      a choice, changed with left / right (or OK)
     slide { label, v, chg(dir), set(v) }  a volume slider, 0 to 1
     text  { label }                       a line of text, cannot be chosen                */
function menuNav(o, key, rows) {
  const M = Input.menu, n = rows.length, ok = i => rows[i] && rows[i].kind !== 'text';
  let sel = clamp(o[key] | 0, 0, n - 1);
  for (let j = 0; j < n && !ok(sel); j++) sel = (sel + 1) % n;
  const step = M.up ? -1 : M.down ? 1 : 0;
  if (step) { let i = sel; for (let j = 0; j < n; j++) { i = (i + step + n) % n; if (ok(i)) break; } if (i !== sel) { sel = i; Snd.play('ui'); } }
  const hv = hitFind(UI.hover); if (hv && hv.id === 'row' && ok(hv.v)) sel = hv.v;
  let act = M.left ? 'left' : M.right ? 'right' : M.ok ? 'ok' : null, val = 0;
  const ck = hitFind(UI.click); if (ck && ck.id === 'row' && ok(ck.v)) { sel = ck.v; act = ck.act || 'ok'; val = ck.val; }
  o[key] = sel;
  const r = rows[sel]; if (!act || !r) return;
  if (r.kind === 'go') { if (act === 'ok') r.ok(); }
  else if (r.kind === 'opt') r.chg(act === 'left' ? -1 : 1);
  else if (r.kind === 'slide') { if (act === 'set') r.set(val); else if (act !== 'ok') r.chg(act === 'left' ? -1 : 1); }
}
function drawMenu(c, t, title, rows, sel, o) {
  o = o || {};
  const n = rows.length, cw = o.w || 1240, rh = o.rh || 72, top = o.top || 0, head = o.sub ? 196 : 150;
  const ch = head + top + n * rh + 126, x = (W - cw) / 2, y = Math.round(Math.max(16, (H - ch) / 2));
  card(c, x, y, cw, ch, '#FFF6E2', 81);
  fitText(c, title, W / 2, y + 80, 66, cw - 160, '#C4573D', { title: true, halo: 0 });
  if (o.sub) fitText(c, o.sub, W / 2, y + 148, 30, cw - 120, '#C4573D', { halo: 0, shadow: 0 });
  if (o.body) o.body(c, x, y + head, cw);
  for (let i = 0; i < n; i++) {
    const r = rows[i], yy = y + head + top + i * rh + rh / 2, on = sel === i, col = on ? '#6A3A30' : '#7A5A60';
    if (r.kind === 'text') { fitText(c, r.label, W / 2, yy, 28, cw - 140, '#8A6A6A', { halo: 0, shadow: 0 }); continue; }
    if (on) card(c, x + 50, yy - rh / 2 + 4, cw - 100, rh - 8, '#F8C24E', 90);
    hitAdd(x + 50, yy - rh / 2, cw - 100, rh, 'row', i);
    if (r.kind === 'go') {
      fitText(c, r.label, W / 2, yy, 38, cw - 260, col, { halo: 0, shadow: 0, weight: 'bold' });
      if (r.dot) { setFont(c, 38, false, 'bold'); const w = Math.min(cw - 260, c.measureText(r.label).width); c.fillStyle = r.dot; c.beginPath(); c.arc(W / 2 - w / 2 - 34, yy, 17, 0, TAU); c.fill(); }
      if (r.more) iconArrow(c, x + cw - 110, yy, 0, 12, on ? '#6A3A30' : '#C4573D');
      continue;
    }
    fitText(c, r.label, x + 96, yy, 36, cw - 660, col, { align: 'left', halo: 0, shadow: 0, weight: 'bold' });
    if (r.kind === 'slide') {
      const x0 = x + cw - 500, lit = Math.round(r.v * 10);
      for (let k = 0; k < 10; k++) { c.fillStyle = k < lit ? '#C4573D' : 'rgba(150,110,100,0.25)'; c.beginPath(); c.ellipse(x0 + k * 40, yy, 14, 20 - (9 - k) * 0.8, 0, 0, TAU); c.fill(); hitAdd(x0 + k * 40 - 20, yy - rh / 2, 40, rh, 'row', i, 'set', (k + 1) / 10); }
      hitAdd(x0 - 70, yy - rh / 2, 50, rh, 'row', i, 'set', 0);
    } else {
      const vx = x + cw - 320;
      if (!r.plain) {
        iconArrow(c, vx - 210, yy, Math.PI, 13, '#C4573D'); iconArrow(c, vx + 210, yy, 0, 13, '#C4573D');
        hitAdd(vx - 250, yy - rh / 2, 80, rh, 'row', i, 'left'); hitAdd(vx + 170, yy - rh / 2, 80, rh, 'row', i, 'right');
      }
      if (r.pulse) c.globalAlpha = 0.6 + 0.4 * Math.sin(t * 7);
      fitText(c, r.value, vx, yy, 36, 370, r.pulse ? '#C4573D' : col, { halo: 0, shadow: 0 });
      c.globalAlpha = 1;
    }
  }
  if (o.msg) fitText(c, o.msg, W / 2, y + ch - 102, 28, cw - 120, '#C4573D', { halo: 0, shadow: 0, weight: 'bold' });
  if (o.hint) fitText(c, o.hint, W / 2, y + ch - 60, 23, cw - 220, '#9A7A7A', { halo: 0, shadow: 0 });
}

function openSettings() {
  UI.set = { page: 'main', p: 0, sel: { main: 0, player: 0, keys: 0, pad: 0 }, msg: '', msgT: 0, cap: '', spk: { list: null, i: [-1, -1], busy: false } };

}
function closeSettings() {
  UI.set = null; Input.autoJoin = true; Input.kbJoin = Game.state !== 'chapters'; Input.bindTo = null; Input.cancelCapture();
  Save.write(); Snd.play('ok');
}
function setMsg(m) { if (UI.set) { UI.set.msg = m; UI.set.msgT = 6; } }
function setPage(page, p) { const s = UI.set; s.page = page; if (p != null) s.p = p; s.msg = ''; s.cap = ''; Input.cancelCapture(); Input.bindTo = page === 'pad' ? heroOf(s.p) : null; Snd.play('ok'); }
function settingsBack() {

}
function toggleFullscreen() {
  const want = !document.fullscreenElement;
  try {
    if (!want) { document.exitFullscreen(); return; }
    const p = document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(() => setMsg(T('set.fsHint')));      // a controller button is not enough for Chrome: it wants a key or a click
  } catch (e) { setMsg(T('set.fsHint')); }
}
function findSpeakers(k) {
  const s = UI.set, sp = s.spk;
  if (!Snd.canSink()) { setMsg(T('spk.unsup')); return; }
  if (sp.busy) return;
  sp.busy = true; setMsg(T('spk.wait'));
  Snd.listOutputs(true).then(res => {
    sp.busy = false; if (!UI.set) return;
    sp.list = res ? res.list : [];
    setMsg(!res ? T('spk.unsup') : res.denied ? T('spk.denied') : sp.list.length ? T('spk.pick') : T('spk.none'));
    // a speaker that calls itself a controller is chosen at once: the first one for the first hero, the second one for the second hero.
    // Left / right still changes it (two controllers have the same name: only the ear can tell which is which).
    if (sp.list.length && !Opt.sink[k]) {
      const pads = []; sp.list.forEach((dv, i) => { if (/controller|dualshock|dualsense|gamepad/i.test(dv.label)) pads.push(i); });
      if (pads.length) { sp.i[k] = pads[Math.min(k, pads.length - 1)] - 1; pickSpeaker(k, 1); }
    }
  }).catch(() => { sp.busy = false; setMsg(T('spk.none')); });
}
function pickSpeaker(k, d) {
  const sp = UI.set.spk, name = CONFIG.heroes[k].name;
  if (!sp.list || !sp.list.length) { findSpeakers(k); return; }
  const n = sp.list.length + 1; let i = sp.i[k]; i = ((i + 1 + d + n) % n) - 1; sp.i[k] = i;
  const dev = i < 0 ? null : sp.list[i];
  Snd.setSink(k, dev).then(ok => {
    if (!ok) { Opt.sink[k] = ''; sp.i[k] = -1; setMsg(T('spk.fail')); return; }
    Opt.sink[k] = dev ? dev.label : ''; Save.write();
    setMsg(T('spk.ok', name, dev ? dev.label : T('set.spkMain')));
    Snd.talk(k, 'ready'); Snd.play('egg', 3, k);
  });
}
function captureKey(k, f) {
  const s = UI.set; s.cap = f; s.msg = '';
  Input.capture(code => {
    if (!UI.set) return;
    UI.set.cap = '';
    if (code === 'Escape') return;
    if (Input.RESERVED[code]) { setMsg(T('key.no')); return; }
    const old = Opt.keys[k][f]; let swapped = false;
    for (let j = 0; j < 2; j++) for (const g of KEY_FIELDS) if (Opt.keys[j][g] === code && !(j === k && g === f)) { Opt.keys[j][g] = old; swapped = true; }
    Opt.keys[k][f] = code; Save.write(); Snd.play('ok');
    setMsg(swapped ? T('key.taken') : '');

    const i = s.spk.i[k], cur = Opt.sink[k] || T('set.spkMain');
    rows.push(s.spk.list && s.spk.list.length ? { kind: 'opt', label: T('set.spk', cfg.name), value: i >= 0 && s.spk.list[i] ? s.spk.list[i].label : cur, chg: d => pickSpeaker(k, d) }

function updateSettings(dt) {
  const s = UI.set, M = Input.menu;
  if (s.msgT > 0) { s.msgT -= dt; if (s.msgT <= 0) s.msg = ''; }

    return;
  }
  s.cap = '';
  if (s.page === 'pad' && Input.joinedNow === heroOf(s.p)) { const k = heroOf(s.p); Snd.play('ok'); Snd.talk(k, 'ready'); Input.rumble(k, 0.6, 0.8, 300, true); setMsg(''); }
  if (Input.pause) { closeSettings(); return; }

}
function drawPadTester(c, x, y, g, t) {

  // OPTIONS

  // △ ○ ✕ □

    c.fillStyle = on ? sI[3] : '#FFF6E2'; c.beginPath(); c.arc(px, py, 19, 0, TAU); c.fill(); c.strokeStyle = on ? sI[3] : off; c.lineWidth = 3; c.stroke();

    if (sI[0] === 3) { c.moveTo(px, py - 9); c.lineTo(px + 9, py + 7); c.lineTo(px - 9, py + 7); c.closePath(); }
    else if (sI[0] === 1) c.arc(px, py, 8.5, 0, TAU);

/* After a restart: send each hero's sounds to the speaker chosen last time, if Chrome still shows it. */
/* Chrome only tells the names of the speakers while it has the microphone permission, and for a page opened from a file it
   forgets that permission when the page is closed. So when the saved speaker is not in the list, the question is asked again
   (ask = true). If the speaker is still not there, the start screen says so: the sounds are then on the computer. */
function restoreSpeakers(ask) {
  if (!(Opt.sink[0] || Opt.sink[1]) || !Snd.canSink()) return;
  Snd.listOutputs(!!ask).then(res => {
    if (!res) return;
    let missing = -1;
    for (let k = 0; k < 2; k++) { if (!Opt.sink[k]) continue; const dev = res.list.find(d => d.label === Opt.sink[k]); if (dev) Snd.setSink(k, dev); else missing = k; }
    if (missing >= 0 && !ask) restoreSpeakers(true);
    else if (missing >= 0) { UI.spkLost = missing; UI.spkLostT = 14; }
  }).catch(() => {});
}

const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
let renderScale = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H), cw = Math.floor(W * s), dpr = window.devicePixelRatio || 1;
  const bw = Math.max(640, Math.min(Math.round(cw * dpr), CONFIG.maxRenderWidth));
  canvas.width = bw; canvas.height = Math.round(bw * H / W);
  canvas.style.width = cw + 'px'; canvas.style.height = Math.floor(H * s) + 'px';
  renderScale = bw / W;
}
addEventListener('resize', resize);
function goFullscreen() { try { const el = document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {}); } catch (e) { /* ignore */ } }
function mousePos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / Math.max(1, r.width) * W, y: (e.clientY - r.top) / Math.max(1, r.height) * H }; }
addEventListener('pointerdown', e => {
  Snd.init(); UI.clicked = true; UI.click = mousePos(e);
  if (Game.state === 'boot' && Opt.fullscreen) goFullscreen();
});
addEventListener('pointermove', e => { UI.hover = mousePos(e); });
addEventListener('keydown', e => {
  Snd.init();
  if (e.code === 'KeyF' && !e.defaultPrevented && !e.repeat) { if (document.fullscreenElement) document.exitFullscreen(); else goFullscreen(); }
  else if (Game.state === 'boot' && Opt.fullscreen) goFullscreen();
});
// "Ecran complet" in Setări always shows what the screen really does, and that is what gets saved
document.addEventListener('fullscreenchange', () => { Opt.fullscreen = !!document.fullscreenElement; if (Game.state !== 'boot') Save.write(); });

Game.toTitle = function () {
  Game.state = 'title'; Game.paused = false; UI.ready = [false, false]; UI.menuSel = 0; UI.startT = -1; UI.lostK = -1; UI.set = null; UI.ask = null;
  Input.autoJoin = true; Input.kbJoin = true; Input.bindTo = null;
